name: scapematch_admin
description: EscapeMatch Admin, o painel do Nícolas.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  scapematch:
    path: ../..
  dominio:
    path: ../../packages/dominio
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  supabase_flutter: ^2.18.3
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Poppins-Medium.ttf
    - assets/brand/logo_admin_icone.svg
    - assets/brand/logo_admin_simbolo.svg
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
