<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    O GitHub Pages não aplica _headers e não deixa escolher cabeçalhos.
    CSP e Referrer-Policy valem nesta meta. O navegador ignora
    frame-ancestors, sandbox e report-uri quando a CSP vem em meta, então
    eles não entram aqui. HSTS, X-Frame-Options, X-Content-Type-Options e o
    Access-Control-Allow-Origin: * do Pages não têm equivalente no HTML.
    O estilo some quando a janela não está num iframe. unsafe-eval e
    wasm-unsafe-eval são do dart2js e do CanvasKit (gstatic ou a pasta
    local). O Admin não chama o Asaas no navegador: a subconta sai pela
    Edge Function. O CanvasKit baixa a Roboto e as Noto de fallback com
    fetch em fonts.gstatic.com/s/ — isso é connect-src. font-src continua
    'self' e data:. O SDK JS do Sentry sai de sentry/11.0.0/ neste site,
    antes do Flutter. script-src não ganha origem nova. Quando o build
    recebe SENTRY_DSN, o envelope segue para *.ingest.sentry.io.
  -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com/flutter-canvaskit/ blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://eujlhicairvksvmssruz.supabase.co wss://eujlhicairvksvmssruz.supabase.co https://www.gstatic.com/flutter-canvaskit/ https://fonts.gstatic.com/s/ https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; frame-src 'none'; manifest-src 'self'; form-action 'self'">
  <style id="scape-frame-guard">html{display:none !important}</style>
  <script>
    (function () {
      if (window.top !== window.self) {
        try { window.top.location = window.self.location; } catch (e) {}
        return;
      }
      var guard = document.getElementById('scape-frame-guard');
      if (guard) guard.remove();
    })();
  </script>
  <script id="sentry-cdn-rewrite" src="sentry/sentry-cdn-rewrite.js"></script>
  <script id="sentry-sdk-local" src="sentry/11.0.0/bundle.tracing.min.js" integrity="sha384-TcpSGbL8WtdpR8lXDGGaurUtinn44aaUcN/5iratedpnLQZYJpnJlzK4pdS8sBn5" crossorigin="anonymous"></script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- O Pages não envia X-Robots-Tag. O noindex fica nesta meta. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="EscapeMatch Admin é o painel do Nícolas. Casas, jogadores, regras e ganhos. Esta versão usa dados de exemplo.">
  <meta name="scapematch-admin" content="separate-app">
  <meta name="theme-color" content="#0F4C4A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EscapeMatch Admin">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>EscapeMatch Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overscroll-behavior: none;
      background: #000000;
    }
    #admin-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #000000;
      z-index: 1;
    }
    #admin-splash a {
      color: #E7F3F2;
      font-family: sans-serif;
      font-size: 16px;
    }
    #admin-splash img {
      width: min(46vh, 240px);
      height: auto;
    }
  </style>
  <script>
    (function () {
      function cover() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'viewport');
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover');
          document.head.appendChild(meta);
          return;
        }
        var content = meta.getAttribute('content') || '';
        if (content.indexOf('viewport-fit=cover') !== -1) return;
        var next = content.replace(/,?\s*viewport-fit=[^,]+/gi, '').replace(/,\s*$/, '');
        meta.setAttribute('content', next + ', viewport-fit=cover');
      }
      cover();
      new MutationObserver(cover).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content']
      });
    })();
  </script>
  <script>
    (function () {
      window.scapeInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        var meta = document.querySelector('meta[name="scapematch-install"]');
        if (!meta || meta.getAttribute('content') !== 'real') return;
        event.preventDefault();
        window.scapeInstallPrompt = event;
        window.dispatchEvent(new Event('scape-install-prompt'));
      });
      window.scapeLaunchInstall = function () {
        var event = window.scapeInstallPrompt;
        if (!event || typeof event.prompt !== 'function') {
          return Promise.resolve('missing');
        }
        window.scapeInstallPrompt = null;
        return event.prompt().then(function () {
          return event.userChoice;
        }).then(function (choice) {
          return choice && choice.outcome ? choice.outcome : 'dismissed';
        });
      };
    })();
  </script>
</head>
<body>
  <div id="admin-splash">
    <img src="icons/logo.svg" alt="">
    <a href="https://escapematch.com.br/">Site oficial do EscapeMatch</a>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('admin-splash');
      if (splash) splash.remove();
    });
  </script>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
