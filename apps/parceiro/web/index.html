<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ScapeMatch Parceiro é o painel da casa. Saldo, reservas e agenda. Esta versão usa dados de exemplo.">
  <meta name="scapematch-parceiro" content="separate-app">
  <meta name="theme-color" content="#0F4C4A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ScapeMatch Parceiro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ScapeMatch Parceiro</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script>
    // Não registra um worker novo. Se a casa ainda tiver o worker de
    // cache, esta visita pede a versão que se desregistra e limpa o cache.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
