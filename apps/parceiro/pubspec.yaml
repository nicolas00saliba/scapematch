name: scapematch_parceiro
description: ScapeMatch Parceiro, o app da casa de escape.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dominio:
    path: ../../packages/dominio
  scapematch:
    path: ../..
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  file_picker: ^13.3.2
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/parceiro/
    - assets/fonts/Poppins-Medium.ttf
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
