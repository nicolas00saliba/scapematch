<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ScapeMatch ajuda a montar grupos para escape rooms. Esta versão usa dados de exemplo.">
  <meta name="scapematch-release" content="home-feed">
  <meta name="theme-color" content="#0F4C4A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ScapeMatch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ScapeMatch</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* O arraste do mapa no Chrome do Android não recarrega a página. */
    html, body {
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script>
    // Um service worker antigo do jogador cobria /scapematch/ inteiro.
    // Se este shell abrir num caminho do Parceiro, solta esse worker e
    // volta para o app da casa. Uma segunda passagem não recarrega.
    (function () {
      var path = location.pathname;
      var marker = '/parceiro';
      var at = path.indexOf(marker);
      if (at < 0) return;
      var tail = path.slice(at + marker.length);
      if (tail !== '' && tail.charAt(0) !== '/') return;
      if (!('serviceWorker' in navigator)) return;
      if (sessionStorage.getItem('scape-partner-shell') === '1') return;
      sessionStorage.setItem('scape-partner-shell', '1');
      var home = path.slice(0, at + marker.length) + '/';
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) {
          if (reg.scope.indexOf(marker + '/') === -1) return reg.unregister();
        }));
      }).then(function () {
        location.replace(home);
      });
    })();
  </script>
  <script>
    // Não registra um worker novo. Se ainda houver um, pede a atualização
    // na hora: o arquivo publicado se desregistra e limpa o cache. No
    // caminho do Parceiro o script acima é quem solta o worker do jogador.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var path = location.pathname;
      var marker = '/parceiro';
      var at = path.indexOf(marker);
      if (at >= 0) {
        var tail = path.slice(at + marker.length);
        if (tail === '' || tail.charAt(0) === '/') return;
      }
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update();
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
