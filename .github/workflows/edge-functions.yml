# Tests the payment gateway and CORS helpers without the Flutter SDK.
name: Edge functions

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  deno:
    name: Deno tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Test
        run: deno test --allow-read supabase/functions
