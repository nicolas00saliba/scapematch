# Dart SDK ^3.13.7 needs Flutter 3.47.8 or newer.
# 3.47.8 is the stable release that ships Dart 3.13.7. Older 3.47
# patch releases ship an earlier Dart and fail `flutter pub get`.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check install identities
        run: bash tool/test_web_install_identity.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Analyze domain package
        working-directory: packages/dominio
        run: |
          dart pub get
          dart analyze

      - name: Test domain package
        working-directory: packages/dominio
        run: dart test

      - name: Install partner dependencies
        working-directory: apps/parceiro
        run: flutter pub get

      - name: Analyze partner app
        working-directory: apps/parceiro
        run: flutter analyze

      - name: Test partner app
        working-directory: apps/parceiro
        run: flutter test

      - name: Install admin dependencies
        working-directory: apps/admin
        run: flutter pub get

      - name: Analyze admin app
        working-directory: apps/admin
        run: flutter analyze

      - name: Test admin app
        working-directory: apps/admin
        run: flutter test

      - name: Build admin web (real)
        working-directory: apps/admin
        run: flutter build web --release --base-href / --dart-define=APP_MODE=real --pwa-strategy=none -o build/web

      - name: Check admin web install
        run: |
          bash tool/install_cleanup_service_worker.sh apps/admin/build/web
          bash tool/stamp_web_manifest.sh apps/admin/build/web admin real
          bash tool/mark_real_web_copy.sh apps/admin/build/web admin
          bash tool/check_web_service_worker.sh apps/admin/build/web admin
          bash tool/check_web_manifest.sh apps/admin/build/web admin real
          bash tool/check_security_meta.sh flutter apps/admin/build/web/index.html
          python3 - <<'PY'
          import base64, json, pathlib, re, sys
          root = pathlib.Path("apps/admin/build/web")
          jwt = re.compile(r"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}")
          failed = False
          for path in (*root.rglob("*.js"), *root.rglob("*.html")):
              text = path.read_text(errors="ignore")
              if "sb_secret_" in text:
                  print(f"sb_secret_ em {path}")
                  failed = True
              for token in jwt.findall(text):
                  payload = token.split(".")[1]
                  pad = "=" * (-len(payload) % 4)
                  try:
                      data = json.loads(base64.urlsafe_b64decode(payload + pad))
                  except (ValueError, json.JSONDecodeError):
                      continue
                  if isinstance(data, dict) and data.get("role") == "service_role":
                      print(f"JWT service_role em {path}")
                      failed = True
          if failed:
              sys.exit(1)
          PY

      # --pwa-strategy=none continua de propósito no Flutter 3.47.8: o
      # bootstrap não registra worker e o arquivo gerado sai vazio. O Chrome
      # Android instala sem service worker (menu desde o 108; o Chrome atual
      # também dispara beforeinstallprompt sem ele). O passo seguinte publica
      # só o script que desregistra o worker antigo. Não é cache.
      - name: Build player web (real)
        run: flutter build web --release --base-href / --dart-define=APP_MODE=real --pwa-strategy=none

      - name: Install the cleanup service worker
        run: |
          bash tool/install_cleanup_service_worker.sh build/web
          bash tool/stamp_web_manifest.sh build/web player real
          bash tool/mark_real_web_copy.sh build/web player
          bash tool/check_web_service_worker.sh build/web player
          bash tool/check_web_manifest.sh build/web player real
          bash tool/check_security_meta.sh flutter build/web/index.html

      - name: Player bundle excludes the partner app
        run: |
          if grep -R -F -q 'ScapeMatch Parceiro' build/web --include='*.js' --include='*.html'; then
            echo 'O bundle do jogador ainda contém o Parceiro.'
            exit 1
          fi
          if grep -R -F -q 'xv@scapematch.exemplo' build/web --include='*.js'; then
            echo 'O bundle do jogador ainda contém o login da casa.'
            exit 1
          fi
          if bash tool/js_contains.sh build/web 'Demonstração'; then
            echo 'O bundle real do jogador ainda tem o selo de demonstração.'
            exit 1
          fi
          if bash tool/js_contains.sh build/web 'O Cofre do Café'; then
            echo 'O bundle real do jogador ainda tem sala de exemplo.'
            exit 1
          fi
          if grep -R -F -q 'dados de exemplo' build/web/index.html; then
            echo 'O index real do jogador ainda fala em dados de exemplo.'
            exit 1
          fi

      - name: Build partner web (real)
        working-directory: apps/parceiro
        run: flutter build web --release --base-href / --dart-define=APP_MODE=real --pwa-strategy=none

      - name: Install the partner cleanup service worker
        run: |
          bash tool/install_cleanup_service_worker.sh apps/parceiro/build/web
          bash tool/stamp_web_manifest.sh apps/parceiro/build/web partner real
          bash tool/mark_real_web_copy.sh apps/parceiro/build/web partner
          bash tool/check_web_service_worker.sh apps/parceiro/build/web partner
          bash tool/check_web_manifest.sh apps/parceiro/build/web partner real
          bash tool/check_security_meta.sh flutter apps/parceiro/build/web/index.html
          if grep -R -F -q 'xv@scapematch.exemplo' apps/parceiro/build/web --include='*.js'; then
            echo 'O bundle do Parceiro ainda tem o login de demonstração.'
            exit 1
          fi
          if grep -R -F -q 'admin@scapematch.exemplo' apps/parceiro/build/web --include='*.js'; then
            echo 'O bundle do Parceiro ainda tem o admin de demonstração.'
            exit 1
          fi
          if grep -R -F -q 'Demo: a / b' apps/parceiro/build/web --include='*.js'; then
            echo 'O bundle do Parceiro ainda tem o atalho a/b.'
            exit 1
          fi
          if bash tool/js_contains.sh apps/parceiro/build/web 'Demonstração'; then
            echo 'O bundle real do Parceiro ainda tem o selo de demonstração.'
            exit 1
          fi
          if bash tool/js_contains.sh apps/parceiro/build/web 'O Cofre do Café'; then
            echo 'O bundle real do Parceiro ainda tem sala de exemplo.'
            exit 1
          fi

      - name: Build player web (demo)
        run: flutter build web --release --base-href / --dart-define=APP_MODE=demo --pwa-strategy=none -o build/player-demo

      - name: Check player demo
        run: |
          bash tool/install_cleanup_service_worker.sh build/player-demo
          bash tool/stamp_web_manifest.sh build/player-demo player demo
          bash tool/check_web_service_worker.sh build/player-demo player
          bash tool/check_web_manifest.sh build/player-demo player demo
          bash tool/check_security_meta.sh flutter build/player-demo/index.html
          grep -F -q 'base href="/"' build/player-demo/index.html
          bash tool/js_contains.sh build/player-demo 'Demonstração'
          bash tool/js_contains.sh build/player-demo 'O Cofre do Café'
          if bash tool/js_contains.sh build/player-demo 'supabase.co'; then
            echo 'A demonstração do jogador ainda aponta para o Supabase.'
            exit 1
          fi
          if grep -R -F -q 'ScapeMatch Parceiro' build/player-demo --include='*.js' --include='*.html'; then
            echo 'A demonstração do jogador contém o Parceiro.'
            exit 1
          fi
          if grep -R -F -q 'xv@scapematch.exemplo' build/player-demo --include='*.js'; then
            echo 'A demonstração do jogador contém o login da casa.'
            exit 1
          fi

      - name: Build partner web (demo)
        working-directory: apps/parceiro
        run: flutter build web --release --base-href / --dart-define=APP_MODE=demo --pwa-strategy=none -o build/parceiro-demo-root

      - name: Check partner demo
        run: |
          bash tool/install_cleanup_service_worker.sh apps/parceiro/build/parceiro-demo-root
          bash tool/stamp_web_manifest.sh apps/parceiro/build/parceiro-demo-root partner demo
          bash tool/check_web_service_worker.sh apps/parceiro/build/parceiro-demo-root partner
          bash tool/check_web_manifest.sh apps/parceiro/build/parceiro-demo-root partner demo
          bash tool/check_security_meta.sh flutter apps/parceiro/build/parceiro-demo-root/index.html
          grep -F -q 'base href="/"' apps/parceiro/build/parceiro-demo-root/index.html
          grep -F -q 'https://parceiro-demo.scapematch.com.br/' apps/parceiro/build/parceiro-demo-root/manifest.json
          bash tool/js_contains.sh apps/parceiro/build/parceiro-demo-root 'Demonstração'
          bash tool/js_contains.sh apps/parceiro/build/parceiro-demo-root 'xv@scapematch.exemplo'
          bash tool/js_contains.sh apps/parceiro/build/parceiro-demo-root 'Demo: a / b'
          if bash tool/js_contains.sh apps/parceiro/build/parceiro-demo-root 'supabase.co'; then
            echo 'A demonstração do Parceiro ainda aponta para o Supabase.'
            exit 1
          fi

  duplicates-sql:
    name: Venue duplicate SQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scapematch_duplicates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations and test duplicates
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/scapematch_duplicates
        run: bash supabase/tests/run_local.sh

  landing:
    name: Static landing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the landing files
        run: |
          test -f apps/landing/index.html
          test -f apps/landing/styles.css
          test ! -e _headers
          test ! -e apps/landing/_headers
          test ! -e web/_headers
          bash tool/check_security_meta.sh landing apps/landing
          bash tool/check_security_meta.sh flutter web/index.html
          bash tool/check_security_meta.sh flutter apps/parceiro/web/index.html
          test -f apps/landing/assets/logo-simbolo.svg
          test -f apps/landing/assets/og.png
          test -f apps/landing/assets/favicon.svg
          test -f netlify.toml
          grep -F -q 'publish = "apps/landing"' netlify.toml
          grep -F -q 'Quero jogar' apps/landing/index.html
          grep -F -q 'Tenho uma casa' apps/landing/index.html
          grep -F -q 'href="#casas"' apps/landing/index.html
          grep -F -q 'href="https://app.scapematch.com.br/"' apps/landing/index.html
          grep -F -q 'href="https://parceiro.scapematch.com.br/"' apps/landing/index.html
          grep -F -q 'href="https://parceiro-demo.scapematch.com.br/"' apps/landing/index.html
          grep -F -q 'canonical" href="https://scapematch.com.br/"' apps/landing/index.html
          grep -F -q 'Acessar o ScapeMatch Parceiro' apps/landing/index.html
          grep -F -q 'Placeholder' apps/landing/index.html
          grep -F -q 'og:image' apps/landing/index.html
          test -f apps/landing/termos.html
          test -f apps/landing/privacidade.html
          test -f apps/landing/cancelamento.html
          test -f apps/landing/termos-parceiro.html
          grep -F -q 'href="termos.html"' apps/landing/index.html
          grep -F -q 'A revisar juridicamente' apps/landing/termos.html
          grep -F -q 'encarregado@exemplo.invalid' apps/landing/privacidade.html
          grep -F -q 'intermediadora' apps/landing/termos-parceiro.html
          grep -F -q 'não é capturada' apps/landing/cancelamento.html
          if grep -E -q '[0-9]+%' apps/landing/index.html; then
            echo 'A landing cita percentual de comissão.'
            exit 1
          fi
