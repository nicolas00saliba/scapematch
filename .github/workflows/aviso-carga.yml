name: Aviso de carga

on:
  pull_request:

permissions:
  contents: read

jobs:
  aviso-carga:
    name: Aviso de carga dos apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Medir o HTML dos apps
        run: python3 tool/aviso_carga.py
