# Links do build e da produção. A rotina diária entra na saúde das ferramentas.
# saude: agenda

name: Links quebrados

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/links-quebrados.yml"

permissions:
  contents: read

jobs:
  lychee:
    name: Build e produção
    runs-on: ubuntu-latest
    env:
      # Só a checagem de https://escapematch.com.br. O lychee 0.24.2
      # (padrão da lychee-action v2.9.0) não retenta HTTP 503: entre os
      # status rejeitados, só o 429 volta a ser pedido. Um 503 curto da
      # borda encerra o passo na hora, mesmo com --max-retries. A repetição
      # fica no passo seguinte. 503 não entra em --accept.
      LYCHEE_ARGS_PRODUCAO: >-
        --verbose
        --no-progress
        --max-retries 4
        --retry-wait-time 10
        --max-concurrency 8
        --timeout 20
        --accept 200,206,429
        --exclude '^https://(app|parceiro|parceiro-demo|demo|admin)\.escapematch\.com\.br/.+'
        'https://escapematch.com.br'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Build the site
        working-directory: apps/site
        run: npm ci && npm run build

      # Rotas do Flutter em GitHub Pages respondem 404 e mesmo assim
      # entregam o app (o 404.html é o index). O lychee olha o status,
      # então essas rotas internas ficam de fora. A raiz de cada host continua.
      # No pull request só os links do próprio dist. Um site externo fora
      # do ar não pode barrar um PR que não tem nada a ver com ele.
      - name: Links internos do build
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --offline
            --root-dir apps/site/dist
            --fallback-extensions html
            'apps/site/dist/**/*.html'

      - name: Links do build
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200,206,429
            --root-dir apps/site/dist
            --fallback-extensions html
            --exclude '^https://(app|parceiro|parceiro-demo|demo|admin)\.escapematch\.com\.br/.+'
            'apps/site/dist/**/*.html'

      # continue-on-error: um 503 na primeira passagem não pode fechar o
      # job antes das tentativas extras. Se elas também falharem, o passo
      # seguinte sai com erro e o workflow continua vermelho.
      - name: Links de produção
        id: links_producao
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: ${{ env.LYCHEE_ARGS_PRODUCAO }}

      - name: Repetir produção se a borda falhou
        if: github.event_name != 'pull_request' && steps.links_producao.outcome == 'failure'
        run: |
          set -euo pipefail
          # O passo anterior já instalou o lychee 0.24.2 e deixou o binário no PATH.
          # Quatro tentativas extras, 10s entre elas. Não muda o --accept:
          # 404 e 5xx que continuam no relatório final derrubam o job.
          for i in 1 2 3 4; do
            echo "Tentativa extra ${i}/4 em 10s"
            sleep 10
            if eval "lychee ${LYCHEE_ARGS_PRODUCAO}"; then
              echo "Checagem de produção passou na tentativa extra ${i}/4." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            fi
          done
          echo "Links de produção seguem falhando depois de 4 tentativas extras." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 1
