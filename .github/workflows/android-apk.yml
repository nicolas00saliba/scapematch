# Builds installable Android APKs and uploads them as run artifacts.
#
# Dart SDK ^3.13.7 needs Flutter 3.47.8 or newer. 3.47.8 is the stable
# release that ships Dart 3.13.7. Debug still builds without a private
# keystore. Release in CI fails unless key.properties or the
# ANDROID_KEYSTORE_* / ANDROID_KEY_* / ANDROID_STORE_PASSWORD variables
# point at a release keystore kept outside the repository.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages-preview
      - cursor/gh-pages-preview-23b9

permissions:
  contents: read

concurrency:
  group: scapematch-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build ${{ matrix.mode }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a release keystore
        if: matrix.mode == 'release'
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH}" ] && [ -n "${ANDROID_STORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ]; then
            if [ ! -f "${ANDROID_KEYSTORE_PATH}" ]; then
              echo "::error::ANDROID_KEYSTORE_PATH does not point to a file on the runner."
              exit 1
            fi
            echo "Release keystore environment is present."
            exit 0
          fi
          if [ -f android/key.properties ]; then
            echo "android/key.properties is present."
            exit 0
          fi
          echo "::error::CI release requires a release keystore outside git (android/key.properties or ANDROID_KEYSTORE_PATH, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Debug signing is refused."
          exit 1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Flutter 3.47 defaults to compileSdk 36 and NDK 28.2.13676358.
      # Install those packages explicitly so the build does not stop on a
      # license prompt or a missing SDK component.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "Android SDK is not installed on this runner."
            exit 1
          fi
          echo "Android SDK: $SDK"
          manager="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            found="$(find "$SDK" -type f -path '*/bin/sdkmanager' -print -quit || true)"
            if [ -n "$found" ]; then
              manager="$found"
            fi
          fi
          if [ ! -x "$manager" ]; then
            echo "Installing Android command-line tools."
            tmp="$(mktemp -d)"
            curl -fL --retry 3 -o "$tmp/cmdtools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$tmp/cmdtools.zip" -d "$tmp"
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$tmp/cmdline-tools" "$SDK/cmdline-tools/latest"
            manager="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$manager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$manager" --sdk_root="$SDK" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "platform-tools"
          flutter doctor -v || true

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --${{ matrix.mode }}

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scapematch-apk-${{ matrix.mode }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk
          if-no-files-found: error
          retention-days: 14
