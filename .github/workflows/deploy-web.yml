# Publishes the Flutter web release on GitHub Pages (subdomínios + legado).
#
# app.scapematch.com.br       → repo nicolas00saliba/scapematch-app
# parceiro.scapematch.com.br  → repo nicolas00saliba/scapematch-parceiro
# demo.scapematch.com.br      → repo nicolas00saliba/scapematch-demo
#                             (jogador em /, Parceiro em /parceiro/)
#
# Transição: também republica o monorepo em
# https://nicolas00saliba.github.io/scapematch/… (base-href antigos) para
# não quebrar quem ainda abre o endereço antigo.
#
# Segredo necessário no repo scapematch:
#   PAGES_DEPLOY_TOKEN — PAT com escrita nos 3 repos de Pages.
#
# --base-href must keep the leading and trailing slash.
# APP_MODE=real|demo escolhe o repositório. O Parceiro continua outro app.
#
# Dart SDK ^3.13.7 needs Flutter 3.47.8 or newer.
name: Deploy web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scapematch-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::O site só é publicado a partir da main."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install partner dependencies
        working-directory: apps/parceiro
        run: flutter pub get

      - name: Build player web (real, subdomain)
        run: |
          flutter build web --release --base-href / --dart-define=APP_MODE=real --pwa-strategy=none -o build/app-root
          bash tool/install_cleanup_service_worker.sh build/app-root
          bash tool/stamp_web_manifest.sh build/app-root player real
          bash tool/mark_real_web_copy.sh build/app-root player
          bash tool/check_web_service_worker.sh build/app-root player
          bash tool/check_web_manifest.sh build/app-root player real
          bash tool/check_security_meta.sh flutter build/app-root/index.html
          grep -F 'base href="/"' build/app-root/index.html
          cp build/app-root/index.html build/app-root/404.html
          touch build/app-root/.nojekyll
          printf 'app.scapematch.com.br\n' > build/app-root/CNAME

      - name: Build partner web (real, subdomain)
        working-directory: apps/parceiro
        run: |
          flutter build web --release --base-href / --dart-define=APP_MODE=real --pwa-strategy=none -o build/parceiro-root
          bash ../../tool/install_cleanup_service_worker.sh build/parceiro-root
          bash ../../tool/stamp_web_manifest.sh build/parceiro-root partner real
          bash ../../tool/mark_real_web_copy.sh build/parceiro-root partner
          bash ../../tool/check_web_service_worker.sh build/parceiro-root partner
          bash ../../tool/check_web_manifest.sh build/parceiro-root partner real
          bash ../../tool/check_security_meta.sh flutter build/parceiro-root/index.html
          grep -F 'base href="/"' build/parceiro-root/index.html
          cp build/parceiro-root/index.html build/parceiro-root/404.html
          touch build/parceiro-root/.nojekyll
          printf 'parceiro.scapematch.com.br\n' > build/parceiro-root/CNAME

      - name: Build player web (demo, subdomain root)
        run: |
          flutter build web --release --base-href / --dart-define=APP_MODE=demo --pwa-strategy=none -o build/demo-player
          bash tool/install_cleanup_service_worker.sh build/demo-player
          bash tool/stamp_web_manifest.sh build/demo-player player demo
          bash tool/check_web_service_worker.sh build/demo-player player
          bash tool/check_web_manifest.sh build/demo-player player demo
          bash tool/check_security_meta.sh flutter build/demo-player/index.html
          grep -F 'base href="/"' build/demo-player/index.html

      - name: Build partner web (demo, subdomain /parceiro/)
        working-directory: apps/parceiro
        run: |
          flutter build web --release --base-href /parceiro/ --dart-define=APP_MODE=demo --pwa-strategy=none -o build/demo-parceiro
          bash ../../tool/install_cleanup_service_worker.sh build/demo-parceiro
          bash ../../tool/stamp_web_manifest.sh build/demo-parceiro partner demo
          bash ../../tool/check_web_service_worker.sh build/demo-parceiro partner
          bash ../../tool/check_web_manifest.sh build/demo-parceiro partner demo
          bash ../../tool/check_security_meta.sh flutter build/demo-parceiro/index.html
          grep -F 'base href="/parceiro/"' build/demo-parceiro/index.html

      - name: Assemble demo site
        run: |
          mkdir -p build/demo-root/parceiro
          cp -a build/demo-player/. build/demo-root/
          cp -a apps/parceiro/build/demo-parceiro/. build/demo-root/parceiro/
          cp build/demo-root/index.html build/demo-root/404.html
          touch build/demo-root/.nojekyll
          printf 'demo.scapematch.com.br\n' > build/demo-root/CNAME
          test -f build/demo-root/index.html
          test -f build/demo-root/parceiro/index.html

      # Legado: quatro apps sob /scapematch/ no monorepo (sem downtime).
      - name: Build legacy monorepo tree
        run: |
          flutter build web --release --base-href /scapematch/ --dart-define=APP_MODE=real --pwa-strategy=none -o build/legacy-player
          bash tool/install_cleanup_service_worker.sh build/legacy-player
          bash tool/stamp_web_manifest.sh build/legacy-player player real
          bash tool/mark_real_web_copy.sh build/legacy-player player
          bash tool/check_web_service_worker.sh build/legacy-player player
          bash tool/check_web_manifest.sh build/legacy-player player real
          bash tool/check_security_meta.sh flutter build/legacy-player/index.html
          (
            cd apps/parceiro
            flutter build web --release --base-href /scapematch/parceiro/ --dart-define=APP_MODE=real --pwa-strategy=none -o build/legacy-parceiro
            bash ../../tool/install_cleanup_service_worker.sh build/legacy-parceiro
            bash ../../tool/stamp_web_manifest.sh build/legacy-parceiro partner real
            bash ../../tool/mark_real_web_copy.sh build/legacy-parceiro partner
            bash ../../tool/check_web_service_worker.sh build/legacy-parceiro partner
            bash ../../tool/check_web_manifest.sh build/legacy-parceiro partner real
            bash ../../tool/check_security_meta.sh flutter build/legacy-parceiro/index.html
          )
          flutter build web --release --base-href /scapematch/demo/ --dart-define=APP_MODE=demo --pwa-strategy=none -o build/legacy-player-demo
          bash tool/install_cleanup_service_worker.sh build/legacy-player-demo
          bash tool/stamp_web_manifest.sh build/legacy-player-demo player demo
          bash tool/check_web_service_worker.sh build/legacy-player-demo player
          bash tool/check_web_manifest.sh build/legacy-player-demo player demo
          bash tool/check_security_meta.sh flutter build/legacy-player-demo/index.html
          (
            cd apps/parceiro
            flutter build web --release --base-href /scapematch/parceiro/demo/ --dart-define=APP_MODE=demo --pwa-strategy=none -o build/legacy-parceiro-demo
            bash ../../tool/install_cleanup_service_worker.sh build/legacy-parceiro-demo
            bash ../../tool/stamp_web_manifest.sh build/legacy-parceiro-demo partner demo
            bash ../../tool/check_web_service_worker.sh build/legacy-parceiro-demo partner
            bash ../../tool/check_web_manifest.sh build/legacy-parceiro-demo partner demo
            bash ../../tool/check_security_meta.sh flutter build/legacy-parceiro-demo/index.html
          )
          mkdir -p build/legacy/parceiro/demo build/legacy/demo build/legacy/site
          cp -a build/legacy-player/. build/legacy/
          cp -a apps/parceiro/build/legacy-parceiro/. build/legacy/parceiro/
          cp -a build/legacy-player-demo/. build/legacy/demo/
          cp -a apps/parceiro/build/legacy-parceiro-demo/. build/legacy/parceiro/demo/
          cp -a apps/landing/. build/legacy/site/
          bash tool/check_security_meta.sh landing build/legacy/site
          cp build/legacy/index.html build/legacy/404.html
          touch build/legacy/.nojekyll
          grep -F 'base href="/scapematch/"' build/legacy/index.html
          grep -F 'base href="/scapematch/parceiro/"' build/legacy/parceiro/index.html

      - name: Upload subdomain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subdomain-sites
          path: |
            build/app-root
            apps/parceiro/build/parceiro-root
            build/demo-root
            build/legacy
          include-hidden-files: "true"
          if-no-files-found: error
          retention-days: 7

  publish-subdomains:
    name: Push subdomain repos
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::O site só é publicado a partir da main."
          exit 1

      - name: Download sites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: subdomain-sites
          path: _sites

      - name: Publish app.scapematch.com.br
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: nicolas00saliba/scapematch-app
          publish_dir: ./_sites/build/app-root
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish ScapeMatch player (app.scapematch.com.br)

      - name: Publish parceiro.scapematch.com.br
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: nicolas00saliba/scapematch-parceiro
          publish_dir: ./_sites/apps/parceiro/build/parceiro-root
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish ScapeMatch Parceiro (parceiro.scapematch.com.br)

      - name: Publish demo.scapematch.com.br
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: nicolas00saliba/scapematch-demo
          publish_dir: ./_sites/build/demo-root
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish ScapeMatch demos (demo.scapematch.com.br)

  publish-legacy:
    name: Push legacy monorepo gh-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::O site só é publicado a partir da main."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download sites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: subdomain-sites
          path: _sites

      - name: Publish the legacy site on gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_sites/build/legacy
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish ScapeMatch legacy github.io tree

  check:
    name: Check public URLs
    needs: [publish-subdomains, publish-legacy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Request the sites
        run: |
          player_new="https://app.scapematch.com.br/"
          partner_new="https://parceiro.scapematch.com.br/"
          demo_new="https://demo.scapematch.com.br/"
          player="https://nicolas00saliba.github.io/scapematch/"
          partner="https://nicolas00saliba.github.io/scapematch/parceiro/"
          echo "### ScapeMatch web" >> "$GITHUB_STEP_SUMMARY"
          echo "$player_new" >> "$GITHUB_STEP_SUMMARY"
          echo "$partner_new" >> "$GITHUB_STEP_SUMMARY"
          echo "$demo_new" >> "$GITHUB_STEP_SUMMARY"
          echo "$player" >> "$GITHUB_STEP_SUMMARY"
          echo "$partner" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 30); do
            n1="$(curl -fsS -L -o /tmp/app.html -w "%{http_code}" "$player_new" || true)"
            n2="$(curl -fsS -L -o /tmp/parc.html -w "%{http_code}" "$partner_new" || true)"
            n3="$(curl -fsS -L -o /tmp/demo.html -w "%{http_code}" "$demo_new" || true)"
            pcode="$(curl -fsS -L -o /tmp/legacy-p.html -w "%{http_code}" "$player" || true)"
            hcode="$(curl -fsS -L -o /tmp/legacy-h.html -w "%{http_code}" "$partner" || true)"
            echo "attempt ${attempt}: app ${n1}, parceiro ${n2}, demo ${n3}, legacy player ${pcode}, legacy partner ${hcode}"
            if [ "$pcode" = "200" ] && grep -F -q 'base href="/scapematch/"' /tmp/legacy-p.html \
              && [ "$hcode" = "200" ] && grep -F -q 'base href="/scapematch/parceiro/"' /tmp/legacy-h.html; then
              echo "Legacy github.io ainda no ar."
              # Subdomínios podem ainda estar sem DNS/cert; não falham a job na transição.
              if [ "$n1" = "200" ] && grep -F -q 'base href="/"' /tmp/app.html; then
                echo "app.scapematch.com.br respondeu."
              else
                echo "app.scapematch.com.br ainda não respondeu (DNS/cert pendente)."
              fi
              exit 0
            fi
            sleep 20
          done
          echo "O github.io legado não voltou a responder."
          exit 1
