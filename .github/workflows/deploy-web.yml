# Publishes the Flutter web release on GitHub Pages (subdomínios + legado).
#
# app.escapematch.com.br            → repo nicolas00saliba/scapematch-app
# parceiro.escapematch.com.br       → repo nicolas00saliba/scapematch-parceiro
# parceiro-demo.escapematch.com.br  → repo nicolas00saliba/scapematch-parceiro-demo
# demo.escapematch.com.br           → repo nicolas00saliba/scapematch-demo
# admin.escapematch.com.br          → repo nicolas00saliba/escapematch-admin
#                                    (cópia também em /scapematch/admin/)
# (demo: jogador em /, /parceiro/ só redireciona)
#
# Transição: também republica o monorepo em
# https://nicolas00saliba.github.io/scapematch/… (base-href antigos) para
# não quebrar quem ainda abre o endereço antigo.
#
# Segredo necessário no repo scapematch:
#   PAGES_DEPLOY_TOKEN — PAT com escrita nos 5 repos de Pages.
#
# Segredos opcionais do Sentry. Sem eles o SDK fica inerte:
#   SENTRY_DSN_APP, SENTRY_DSN_PARCEIRO, SENTRY_DSN_ADMIN
# O release é o SHA do commit. O site institucional não passa por este
# workflow: tool/sync-site.sh compila apps/site e envia o dist ao
# repositório scapematch-site. O DSN desse build é PUBLIC_SENTRY_DSN
# no ambiente do script.
#
# --base-href must keep the leading and trailing slash.
# APP_MODE=real|demo escolhe o repositório. O Parceiro continua outro app.
#
# Dart SDK ^3.13.7 needs Flutter 3.47.8 or newer.
name: Deploy web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scapematch-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN_APP: ${{ secrets.SENTRY_DSN_APP }}
      SENTRY_DSN_PARCEIRO: ${{ secrets.SENTRY_DSN_PARCEIRO }}
      SENTRY_DSN_ADMIN: ${{ secrets.SENTRY_DSN_ADMIN }}
      SENTRY_RELEASE: ${{ github.sha }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::O site só é publicado a partir da main."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install partner dependencies
        working-directory: apps/parceiro
        run: flutter pub get

      - name: Install admin dependencies
        working-directory: apps/admin
        run: flutter pub get

      - name: Build player web (real, subdomain)
        run: |
          flutter build web --release --base-href / --dart-define=APP_MODE=real --pwa-strategy=none -o build/app-root $(bash tool/sentry_defines.sh app production)
          bash tool/install_cleanup_service_worker.sh build/app-root
          bash tool/stamp_web_manifest.sh build/app-root player real
          bash tool/mark_real_web_copy.sh build/app-root player
          bash tool/check_web_service_worker.sh build/app-root player
          bash tool/check_web_manifest.sh build/app-root player real
          bash tool/check_security_meta.sh flutter build/app-root/index.html
          grep -F 'base href="/"' build/app-root/index.html
          cp build/app-root/index.html build/app-root/404.html
          touch build/app-root/.nojekyll
          printf 'app.escapematch.com.br\n' > build/app-root/CNAME

      - name: Build partner web (real, subdomain)
        working-directory: apps/parceiro
        run: |
          flutter build web --release --base-href / --dart-define=APP_MODE=real --pwa-strategy=none -o build/parceiro-root $(bash ../../tool/sentry_defines.sh parceiro production)
          bash ../../tool/install_cleanup_service_worker.sh build/parceiro-root
          bash ../../tool/stamp_web_manifest.sh build/parceiro-root partner real
          bash ../../tool/mark_real_web_copy.sh build/parceiro-root partner
          bash ../../tool/check_web_service_worker.sh build/parceiro-root partner
          bash ../../tool/check_web_manifest.sh build/parceiro-root partner real
          bash ../../tool/check_security_meta.sh flutter build/parceiro-root/index.html
          grep -F 'base href="/"' build/parceiro-root/index.html
          cp build/parceiro-root/index.html build/parceiro-root/404.html
          touch build/parceiro-root/.nojekyll
          printf 'parceiro.escapematch.com.br\n' > build/parceiro-root/CNAME

      - name: Build admin web (real, subdomínio proposto)
        working-directory: apps/admin
        run: |
          flutter build web --release --base-href / --dart-define=APP_MODE=real --pwa-strategy=none -o build/admin-root $(bash ../../tool/sentry_defines.sh admin production)
          bash ../../tool/install_cleanup_service_worker.sh build/admin-root
          bash ../../tool/stamp_web_manifest.sh build/admin-root admin real
          bash ../../tool/mark_real_web_copy.sh build/admin-root admin
          bash ../../tool/check_web_service_worker.sh build/admin-root admin
          bash ../../tool/check_web_manifest.sh build/admin-root admin real
          bash ../../tool/check_security_meta.sh admin build/admin-root/index.html
          grep -F 'base href="/"' build/admin-root/index.html
          cp build/admin-root/index.html build/admin-root/404.html
          touch build/admin-root/.nojekyll
          printf 'admin.escapematch.com.br\n' > build/admin-root/CNAME

      - name: Build player web (demo, subdomain root)
        run: |
          flutter build web --release --base-href / --dart-define=APP_MODE=demo --pwa-strategy=none -o build/demo-player $(bash tool/sentry_defines.sh app demo)
          bash tool/install_cleanup_service_worker.sh build/demo-player
          bash tool/stamp_web_manifest.sh build/demo-player player demo
          bash tool/check_web_service_worker.sh build/demo-player player
          bash tool/check_web_manifest.sh build/demo-player player demo
          bash tool/check_security_meta.sh flutter build/demo-player/index.html
          grep -F 'base href="/"' build/demo-player/index.html

      - name: Build partner web (demo, parceiro-demo.escapematch.com.br)
        working-directory: apps/parceiro
        run: |
          flutter build web --release --base-href / --dart-define=APP_MODE=demo --pwa-strategy=none -o build/parceiro-demo-root $(bash ../../tool/sentry_defines.sh parceiro demo)
          bash ../../tool/install_cleanup_service_worker.sh build/parceiro-demo-root
          bash ../../tool/stamp_web_manifest.sh build/parceiro-demo-root partner demo
          bash ../../tool/check_web_service_worker.sh build/parceiro-demo-root partner
          bash ../../tool/check_web_manifest.sh build/parceiro-demo-root partner demo
          bash ../../tool/check_security_meta.sh flutter build/parceiro-demo-root/index.html
          grep -F 'base href="/"' build/parceiro-demo-root/index.html
          cp build/parceiro-demo-root/index.html build/parceiro-demo-root/404.html
          touch build/parceiro-demo-root/.nojekyll
          printf 'parceiro-demo.escapematch.com.br\n' > build/parceiro-demo-root/CNAME

      - name: Assemble demo site
        run: |
          mkdir -p build/demo-root/parceiro
          cp -a build/demo-player/. build/demo-root/
          cp tool/parceiro_demo_redirect/index.html build/demo-root/parceiro/index.html
          cp tool/parceiro_demo_redirect/index.html build/demo-root/parceiro/404.html
          cp tool/parceiro_demo_redirect/redirect.js build/demo-root/parceiro/redirect.js
          cp build/demo-root/index.html build/demo-root/404.html
          touch build/demo-root/.nojekyll
          printf 'demo.escapematch.com.br\n' > build/demo-root/CNAME
          test -f build/demo-root/index.html
          test -f build/demo-root/parceiro/index.html
          test -f build/demo-root/parceiro/404.html
          test ! -e build/demo-root/parceiro/manifest.json
          test ! -e build/demo-root/parceiro/flutter_service_worker.js
          grep -F -q 'https://parceiro-demo.escapematch.com.br/' build/demo-root/parceiro/index.html
          grep -F -q 'http-equiv="refresh"' build/demo-root/parceiro/index.html
          ! grep -F -q 'rel="manifest"' build/demo-root/parceiro/index.html
          ! grep -F -q 'serviceWorker.register' build/demo-root/parceiro/redirect.js
          python3 - <<'PY'
          import json
          manifest = json.load(open("build/demo-root/manifest.json"))
          identity = "https://demo.escapematch.com.br/"
          for key in ("id", "start_url", "scope"):
              if manifest.get(key) != identity:
                  raise SystemExit(f"PWA da demo do jogador mudou: {key}")
          if manifest.get("name") != "EscapeMatch Demo" or manifest.get("short_name") != "Escape Demo":
              raise SystemExit("nome da demo do jogador mudou")
          print("demo do jogador intacta")
          PY

      # Legado: quatro apps sob /scapematch/ no monorepo (sem downtime).
      - name: Build legacy monorepo tree
        run: |
          flutter build web --release --base-href /scapematch/ --dart-define=APP_MODE=real --pwa-strategy=none -o build/legacy-player $(bash tool/sentry_defines.sh app production)
          bash tool/install_cleanup_service_worker.sh build/legacy-player
          bash tool/stamp_web_manifest.sh build/legacy-player player real
          bash tool/mark_real_web_copy.sh build/legacy-player player
          bash tool/check_web_service_worker.sh build/legacy-player player
          bash tool/check_web_manifest.sh build/legacy-player player real
          bash tool/check_security_meta.sh flutter build/legacy-player/index.html
          (
            cd apps/parceiro
            flutter build web --release --base-href /scapematch/parceiro/ --dart-define=APP_MODE=real --pwa-strategy=none -o build/legacy-parceiro $(bash ../../tool/sentry_defines.sh parceiro production)
            bash ../../tool/install_cleanup_service_worker.sh build/legacy-parceiro
            bash ../../tool/stamp_web_manifest.sh build/legacy-parceiro partner real
            bash ../../tool/mark_real_web_copy.sh build/legacy-parceiro partner
            bash ../../tool/check_web_service_worker.sh build/legacy-parceiro partner
            bash ../../tool/check_web_manifest.sh build/legacy-parceiro partner real
            bash ../../tool/check_security_meta.sh flutter build/legacy-parceiro/index.html
          )
          flutter build web --release --base-href /scapematch/demo/ --dart-define=APP_MODE=demo --pwa-strategy=none -o build/legacy-player-demo $(bash tool/sentry_defines.sh app demo)
          bash tool/install_cleanup_service_worker.sh build/legacy-player-demo
          bash tool/stamp_web_manifest.sh build/legacy-player-demo player demo
          bash tool/check_web_service_worker.sh build/legacy-player-demo player
          bash tool/check_web_manifest.sh build/legacy-player-demo player demo
          bash tool/check_security_meta.sh flutter build/legacy-player-demo/index.html
          (
            cd apps/parceiro
            flutter build web --release --base-href /scapematch/parceiro/demo/ --dart-define=APP_MODE=demo --pwa-strategy=none -o build/legacy-parceiro-demo $(bash ../../tool/sentry_defines.sh parceiro demo)
            bash ../../tool/install_cleanup_service_worker.sh build/legacy-parceiro-demo
            bash ../../tool/stamp_web_manifest.sh build/legacy-parceiro-demo partner demo
            bash ../../tool/check_web_service_worker.sh build/legacy-parceiro-demo partner
            bash ../../tool/check_web_manifest.sh build/legacy-parceiro-demo partner demo
            bash ../../tool/check_security_meta.sh flutter build/legacy-parceiro-demo/index.html
          )
          (
            cd apps/admin
            flutter build web --release --base-href /scapematch/admin/ --dart-define=APP_MODE=real --pwa-strategy=none -o build/legacy-admin $(bash ../../tool/sentry_defines.sh admin production)
            bash ../../tool/install_cleanup_service_worker.sh build/legacy-admin
            bash ../../tool/stamp_web_manifest.sh build/legacy-admin admin real
            bash ../../tool/mark_real_web_copy.sh build/legacy-admin admin
            bash ../../tool/check_web_service_worker.sh build/legacy-admin admin
            bash ../../tool/check_web_manifest.sh build/legacy-admin admin real
            bash ../../tool/check_security_meta.sh admin build/legacy-admin/index.html
          )
          mkdir -p build/legacy/parceiro/demo build/legacy/demo build/legacy/admin build/legacy/site
          cp -a build/legacy-player/. build/legacy/
          cp -a apps/parceiro/build/legacy-parceiro/. build/legacy/parceiro/
          cp -a build/legacy-player-demo/. build/legacy/demo/
          cp -a apps/parceiro/build/legacy-parceiro-demo/. build/legacy/parceiro/demo/
          cp -a apps/admin/build/legacy-admin/. build/legacy/admin/
          cp -a apps/landing/. build/legacy/site/
          bash tool/check_security_meta.sh landing build/legacy/site
          cp build/legacy/index.html build/legacy/404.html
          touch build/legacy/.nojekyll
          grep -F 'base href="/scapematch/"' build/legacy/index.html
          grep -F 'base href="/scapematch/parceiro/"' build/legacy/parceiro/index.html
          grep -F 'base href="/scapematch/admin/"' build/legacy/admin/index.html

      - name: Upload subdomain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subdomain-sites
          path: |
            build/app-root
            apps/parceiro/build/parceiro-root
            apps/parceiro/build/parceiro-demo-root
            apps/admin/build/admin-root
            build/demo-root
            build/legacy
          include-hidden-files: "true"
          if-no-files-found: error
          retention-days: 7

  publish-subdomains:
    name: Push subdomain repos
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::O site só é publicado a partir da main."
          exit 1

      - name: Download sites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: subdomain-sites
          path: _sites

      - name: Publish app.escapematch.com.br
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: nicolas00saliba/scapematch-app
          publish_dir: ./_sites/build/app-root
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish EscapeMatch player (app.escapematch.com.br)

      - name: Publish parceiro.escapematch.com.br
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: nicolas00saliba/scapematch-parceiro
          publish_dir: ./_sites/apps/parceiro/build/parceiro-root
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish EscapeMatch Parceiro (parceiro.escapematch.com.br)

      - name: Publish parceiro-demo.escapematch.com.br
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: nicolas00saliba/scapematch-parceiro-demo
          publish_dir: ./_sites/apps/parceiro/build/parceiro-demo-root
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish EscapeMatch Parceiro Demo (parceiro-demo.escapematch.com.br)

      - name: Publish demo.escapematch.com.br
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: nicolas00saliba/scapematch-demo
          publish_dir: ./_sites/build/demo-root
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish EscapeMatch demos (demo.escapematch.com.br)

      - name: Publish admin.escapematch.com.br
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: nicolas00saliba/escapematch-admin
          publish_dir: ./_sites/apps/admin/build/admin-root
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish EscapeMatch Admin (admin.escapematch.com.br)

  publish-legacy:
    name: Push legacy monorepo gh-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::O site só é publicado a partir da main."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download sites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: subdomain-sites
          path: _sites

      - name: Publish the legacy site on gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_sites/build/legacy
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish EscapeMatch legacy github.io tree

  check:
    name: Check public URLs
    needs: [publish-subdomains, publish-legacy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Request the sites
        run: |
          player_new="https://app.escapematch.com.br/"
          partner_new="https://parceiro.escapematch.com.br/"
          partner_demo="https://parceiro-demo.escapematch.com.br/"
          demo_new="https://demo.escapematch.com.br/"
          demo_partner="https://demo.escapematch.com.br/parceiro/"
          player="https://nicolas00saliba.github.io/scapematch/"
          partner="https://nicolas00saliba.github.io/scapematch/parceiro/"
          echo "### EscapeMatch web" >> "$GITHUB_STEP_SUMMARY"
          echo "$player_new" >> "$GITHUB_STEP_SUMMARY"
          echo "$partner_new" >> "$GITHUB_STEP_SUMMARY"
          echo "$partner_demo" >> "$GITHUB_STEP_SUMMARY"
          echo "$demo_new" >> "$GITHUB_STEP_SUMMARY"
          echo "$demo_partner" >> "$GITHUB_STEP_SUMMARY"
          echo "$player" >> "$GITHUB_STEP_SUMMARY"
          echo "$partner" >> "$GITHUB_STEP_SUMMARY"
          legacy_ok=0
          app_ok=0
          demo_up=0
          partner_demo_ok=0
          partner_demo_seen=0
          redirect_ok=0
          demo_manifest_ok=0
          for attempt in $(seq 1 30); do
            n1="$(curl -sS -L --max-time 25 -o /tmp/app.html -w "%{http_code}" "$player_new" || true)"
            n2="$(curl -sS -L --max-time 25 -o /tmp/parc.html -w "%{http_code}" "$partner_new" || true)"
            n3="$(curl -sS -L --max-time 25 -o /tmp/demo.html -w "%{http_code}" "$demo_new" || true)"
            n4="$(curl -sS -L --max-time 25 -o /tmp/pdemo.html -w "%{http_code}" "$partner_demo" || true)"
            n4m="$(curl -sS -L --max-time 25 -o /tmp/pdemo-manifest.json -w "%{http_code}" "${partner_demo}manifest.json" || true)"
            n5="$(curl -sS -L --max-time 25 -o /tmp/predir.html -w "%{http_code}" "$demo_partner" || true)"
            n3m="$(curl -sS -L --max-time 25 -o /tmp/demo-manifest.json -w "%{http_code}" "${demo_new}manifest.json" || true)"
            pcode="$(curl -sS -L --max-time 25 -o /tmp/legacy-p.html -w "%{http_code}" "$player" || true)"
            hcode="$(curl -sS -L --max-time 25 -o /tmp/legacy-h.html -w "%{http_code}" "$partner" || true)"
            echo "attempt ${attempt}: app ${n1}, parceiro ${n2}, demo ${n3}, parceiro-demo ${n4}/${n4m}, demo/parceiro ${n5}, legacy player ${pcode}, legacy partner ${hcode}"
            if [ "$pcode" = "200" ] && grep -F -q 'base href="/scapematch/"' /tmp/legacy-p.html \
              && [ "$hcode" = "200" ] && grep -F -q 'base href="/scapematch/parceiro/"' /tmp/legacy-h.html; then
              legacy_ok=1
            fi
            if [ "$n1" = "200" ] && grep -F -q 'base href="/"' /tmp/app.html; then
              app_ok=1
            fi
            if [ "$n3" = "200" ]; then
              demo_up=1
            fi
            if [ -n "$n4" ] && [ "$n4" != "000" ]; then
              partner_demo_seen=1
            fi
            if [ "$n4" = "200" ] && grep -F -q 'base href="/"' /tmp/pdemo.html \
              && [ "$n4m" = "200" ] \
              && grep -F -q '"id": "https://parceiro-demo.escapematch.com.br/"' /tmp/pdemo-manifest.json \
              && grep -F -q '"start_url": "https://parceiro-demo.escapematch.com.br/"' /tmp/pdemo-manifest.json \
              && grep -F -q '"scope": "https://parceiro-demo.escapematch.com.br/"' /tmp/pdemo-manifest.json \
              && grep -F -q '"name": "EscapeMatch Parceiro Demo"' /tmp/pdemo-manifest.json; then
              partner_demo_ok=1
            fi
            if [ "$n5" = "200" ] && grep -F -q 'https://parceiro-demo.escapematch.com.br/' /tmp/predir.html \
              && grep -F -q 'http-equiv="refresh"' /tmp/predir.html \
              && ! grep -F -q 'rel="manifest"' /tmp/predir.html \
              && ! grep -F -q 'serviceWorker.register' /tmp/predir.html; then
              redirect_ok=1
            fi
            if [ "$n3m" = "200" ] \
              && grep -F -q '"id": "https://demo.escapematch.com.br/"' /tmp/demo-manifest.json \
              && grep -F -q '"start_url": "https://demo.escapematch.com.br/"' /tmp/demo-manifest.json \
              && grep -F -q '"scope": "https://demo.escapematch.com.br/"' /tmp/demo-manifest.json \
              && grep -F -q '"name": "EscapeMatch Demo"' /tmp/demo-manifest.json; then
              demo_manifest_ok=1
            fi
            if [ "$legacy_ok" = "1" ]; then
              pending=0
              if [ "$partner_demo_seen" = "1" ] && [ "$partner_demo_ok" != "1" ]; then
                pending=1
              fi
              if [ "$demo_up" = "1" ] && [ "$redirect_ok" != "1" ]; then
                pending=1
              fi
              if [ "$demo_up" = "1" ] && [ "$demo_manifest_ok" != "1" ]; then
                pending=1
              fi
              if [ "$pending" = "0" ]; then
                break
              fi
            fi
            sleep 20
          done
          if [ "$legacy_ok" != "1" ]; then
            echo "O github.io legado não voltou a responder."
            exit 1
          fi
          echo "Legacy github.io ainda no ar."
          if [ "$app_ok" = "1" ]; then
            echo "app.escapematch.com.br respondeu."
          else
            echo "app.escapematch.com.br ainda não respondeu (DNS/cert pendente)."
          fi
          if [ "$partner_demo_ok" = "1" ]; then
            echo "parceiro-demo.escapematch.com.br respondeu."
          elif [ "$partner_demo_seen" = "1" ]; then
            echo "parceiro-demo.escapematch.com.br respondeu sem o app da demonstração."
            exit 1
          else
            echo "parceiro-demo.escapematch.com.br ainda não respondeu (repo, DNS ou cert pendente)."
          fi
          if [ "$demo_up" != "1" ]; then
            echo "demo.escapematch.com.br ainda não respondeu (DNS/cert pendente)."
          elif [ "$redirect_ok" != "1" ]; then
            echo "A demo respondeu, mas /parceiro/ ainda não redireciona."
            exit 1
          elif [ "$demo_manifest_ok" != "1" ]; then
            echo "O manifest da demo do jogador mudou."
            exit 1
          else
            echo "demo.escapematch.com.br/parceiro/ redireciona para o Parceiro demo."
            echo "O PWA da demo do jogador segue em https://demo.escapematch.com.br/."
          fi
