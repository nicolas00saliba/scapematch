# Publishes the Flutter web release on GitHub Pages.
#
# Player: https://nicolas00saliba.github.io/scapematch/
# Partner: https://nicolas00saliba.github.io/scapematch/parceiro/
# Player demo: https://nicolas00saliba.github.io/scapematch/demo/
# Partner demo: https://nicolas00saliba.github.io/scapematch/parceiro/demo/
# Landing preview: https://nicolas00saliba.github.io/scapematch/site/
# --base-href must keep the leading and trailing slash.
# APP_MODE=real|demo escolhe o repositório. O Parceiro continua outro app.
#
# Dart SDK ^3.13.7 needs Flutter 3.47.8 or newer. 3.47.8 is the stable
# release that ships Dart 3.13.7.
#
# Triggers: manual run, pushes to the preview branches, and pushes to
# main so a merge republishes the site. The Pages site is already served
# from the gh-pages branch (root). Deploying with actions/deploy-pages
# fails when the environment only accepts the default branch, and that
# failed job turns the whole run red. This workflow only pushes the
# built site to gh-pages. It does not push commits onto main.
name: Deploy web

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages-preview
      - cursor/gh-pages-preview-23b9
      - cursor/two-sample-groups-per-city-7ef7
      - cursor/group-logistics-5b63
      - cursor/landing-institucional-d3c3
      - main

permissions:
  contents: write

concurrency:
  group: scapematch-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install partner dependencies
        working-directory: apps/parceiro
        run: flutter pub get

      # --pwa-strategy=none no Flutter 3.47.8 não registra worker de cache.
      # O arquivo publicado no lugar se desregistra, apaga os caches e
      # recarrega quem ainda está preso no build antigo.
      - name: Build player web (real)
        run: |
          flutter build web --release --base-href /scapematch/ --dart-define=APP_MODE=real --pwa-strategy=none
          bash tool/install_cleanup_service_worker.sh build/web
          bash tool/mark_real_web_copy.sh build/web player
          bash tool/check_web_service_worker.sh build/web player

      - name: Build partner web (real)
        working-directory: apps/parceiro
        run: |
          flutter build web --release --base-href /scapematch/parceiro/ --dart-define=APP_MODE=real --pwa-strategy=none
          bash ../../tool/install_cleanup_service_worker.sh build/web
          bash ../../tool/mark_real_web_copy.sh build/web partner
          bash ../../tool/check_web_service_worker.sh build/web partner

      - name: Build player web (demo)
        run: |
          flutter build web --release --base-href /scapematch/demo/ --dart-define=APP_MODE=demo --pwa-strategy=none -o build/player-demo
          bash tool/install_cleanup_service_worker.sh build/player-demo
          bash tool/check_web_service_worker.sh build/player-demo player

      - name: Build partner web (demo)
        working-directory: apps/parceiro
        run: |
          flutter build web --release --base-href /scapematch/parceiro/demo/ --dart-define=APP_MODE=demo --pwa-strategy=none -o build/partner-demo
          bash ../../tool/install_cleanup_service_worker.sh build/partner-demo
          bash ../../tool/check_web_service_worker.sh build/partner-demo partner

      - name: Assemble the four apps
        run: |
          test ! -e build/web/parceiro
          test ! -e build/web/demo
          mkdir -p build/web/parceiro build/web/demo
          cp -a apps/parceiro/build/web/. build/web/parceiro/
          cp -a build/player-demo/. build/web/demo/
          mkdir -p build/web/parceiro/demo
          cp -a apps/parceiro/build/partner-demo/. build/web/parceiro/demo/
          test -f build/web/parceiro/index.html
          test -f build/web/demo/index.html
          test -f build/web/parceiro/demo/index.html
          grep -F 'base href="/scapematch/"' build/web/index.html
          grep -F 'base href="/scapematch/parceiro/"' build/web/parceiro/index.html
          grep -F 'base href="/scapematch/demo/"' build/web/demo/index.html
          grep -F 'base href="/scapematch/parceiro/demo/"' build/web/parceiro/demo/index.html

      # Pages serves 404.html for paths the static host does not know.
      # Copying the player shell lets go_router open /groups and the other
      # player routes. /parceiro/ is a real directory, so it is not the 404.
      - name: Add SPA fallback and disable Jekyll
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      # Static landing, copied as-is. /site/ is a real directory, so the
      # player 404 shell does not take this path. Player and partner stay
      # at the same URLs.
      - name: Add landing preview
        run: |
          test ! -e build/web/site
          mkdir -p build/web/site
          cp -a apps/landing/. build/web/site/
          test -f build/web/site/index.html
          test -f build/web/index.html
          test -f build/web/parceiro/index.html
          test -f build/web/demo/index.html
          test -f build/web/parceiro/demo/index.html
          grep -F 'base href="/scapematch/"' build/web/index.html
          grep -F 'base href="/scapematch/parceiro/"' build/web/parceiro/index.html
          grep -F 'base href="/scapematch/demo/"' build/web/demo/index.html
          grep -F 'base href="/scapematch/parceiro/demo/"' build/web/parceiro/demo/index.html
          grep -F -q 'Quero jogar' build/web/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
          include-hidden-files: "true"

      - name: Upload web site for the gh-pages fallback
        uses: actions/upload-artifact@v7
        with:
          name: web-site
          path: build/web
          include-hidden-files: "true"
          if-no-files-found: error
          retention-days: 7

  publish-gh-pages:
    name: Push gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: web-site
          path: _site

      - name: Publish the site on gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish ScapeMatch player, partner, and demo web

  check:
    name: Check public URL
    needs: publish-gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Request the project site
        run: |
          player="https://nicolas00saliba.github.io/scapematch/"
          partner="https://nicolas00saliba.github.io/scapematch/parceiro/"
          player_demo="https://nicolas00saliba.github.io/scapematch/demo/"
          partner_demo="https://nicolas00saliba.github.io/scapematch/parceiro/demo/"
          site="https://nicolas00saliba.github.io/scapematch/site/"
          echo "### ScapeMatch web" >> "$GITHUB_STEP_SUMMARY"
          echo "$player" >> "$GITHUB_STEP_SUMMARY"
          echo "$partner" >> "$GITHUB_STEP_SUMMARY"
          echo "$player_demo" >> "$GITHUB_STEP_SUMMARY"
          echo "$partner_demo" >> "$GITHUB_STEP_SUMMARY"
          echo "$site" >> "$GITHUB_STEP_SUMMARY"
          # The first gh-pages publish stayed 404 for longer than four minutes.
          for attempt in $(seq 1 30); do
            pcode="$(curl -fsS -L -o /tmp/scapematch.html -w "%{http_code}" "$player" || true)"
            hcode="$(curl -fsS -L -o /tmp/parceiro.html -w "%{http_code}" "$partner" || true)"
            dcode="$(curl -fsS -L -o /tmp/demo.html -w "%{http_code}" "$player_demo" || true)"
            ccode="$(curl -fsS -L -o /tmp/parceiro-demo.html -w "%{http_code}" "$partner_demo" || true)"
            scode="$(curl -fsS -L -o /tmp/site.html -w "%{http_code}" "$site" || true)"
            echo "attempt ${attempt}: player HTTP ${pcode}, partner HTTP ${hcode}, demo HTTP ${dcode}, partner demo HTTP ${ccode}, site HTTP ${scode}"
            if [ "$pcode" = "200" ] && grep -Eq 'name="scapematch-release" content="[^"]+"' /tmp/scapematch.html \
              && grep -F -q 'base href="/scapematch/"' /tmp/scapematch.html \
              && [ "$hcode" = "200" ] && grep -q 'ScapeMatch Parceiro' /tmp/parceiro.html \
              && grep -F -q 'base href="/scapematch/parceiro/"' /tmp/parceiro.html \
              && [ "$dcode" = "200" ] && grep -F -q 'base href="/scapematch/demo/"' /tmp/demo.html \
              && [ "$ccode" = "200" ] && grep -q 'ScapeMatch Parceiro' /tmp/parceiro-demo.html \
              && grep -F -q 'base href="/scapematch/parceiro/demo/"' /tmp/parceiro-demo.html \
              && [ "$scode" = "200" ] && grep -F -q 'Quero jogar' /tmp/site.html \
              && grep -F -q 'Tenho uma casa' /tmp/site.html; then
              echo "Public site returned the four apps and the landing."
              exit 0
            fi
            sleep 20
          done
          echo "The public URL did not return the four Flutter shells and the landing."
          echo "An admin may still need to enable Pages. See the workflow log from the deploy job."
          exit 1
