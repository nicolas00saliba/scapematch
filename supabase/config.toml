# E-mails do Auth, em pt-BR. O CLI local lê subject e content_path.
# O projeto remoto não muda sozinho. Cole cada assunto e o HTML em
# Authentication > Email Templates, ou rode tool/apply_auth_email_templates.sh
# com SUPABASE_ACCESS_TOKEN. O script não guarda o token.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no ScapeMatch"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha no ScapeMatch"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Seu link para entrar no ScapeMatch"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme a troca de e-mail no ScapeMatch"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Você foi convidado para o ScapeMatch"
content_path = "./supabase/templates/invite.html"
