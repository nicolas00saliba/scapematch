[functions.provision-venue-wallet]
verify_jwt = true

[functions.tokenize-card]
verify_jwt = true

[functions.create-charge]
verify_jwt = true

[functions.settle-charges]
verify_jwt = true

[functions.asaas-webhook]
verify_jwt = false

[functions.configure-venue-fiscal]
verify_jwt = true

[functions.invoice-document]
verify_jwt = true

# O cron manda x-reconcile-secret, não um JWT. A função confere o segredo.
[functions.reconcile-payments]
verify_jwt = false

[functions.venue-payouts]
verify_jwt = true

[functions.venue-documents]
verify_jwt = true

# O cron manda x-venue-withdrawals-secret, não um JWT.
[functions.schedule-venue-withdrawals]
verify_jwt = false

# O Asaas manda asaas-access-token, o mesmo segredo do webhook de cobrança.
[functions.asaas-transfer-webhook]
verify_jwt = false

# E-mails do Auth, em pt-BR. O CLI local lê subject e content_path.
# O projeto remoto não muda sozinho. Cole cada assunto e o HTML em
# Authentication > Email Templates, ou rode tool/apply_auth_email_templates.sh
# com SUPABASE_ACCESS_TOKEN. O script não guarda o token.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no EscapeMatch"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha no EscapeMatch"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Seu link para entrar no EscapeMatch"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme a troca de e-mail no EscapeMatch"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Você foi convidado para o EscapeMatch"
content_path = "./supabase/templates/invite.html"
