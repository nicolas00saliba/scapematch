[functions.provision-venue-wallet]
verify_jwt = true

[functions.pagbank-connect]
verify_jwt = true

# O dono manda o JWT. A função lê o token da casa e não o devolve.
[functions.venue-pagbank-balance]
verify_jwt = true

[functions.venue-claim]
verify_jwt = true

[functions.tokenize-card]
verify_jwt = true

[functions.create-charge]
verify_jwt = true

[functions.settle-charges]
verify_jwt = true

[functions.pagbank-webhook]
verify_jwt = false

[functions.configure-venue-fiscal]
verify_jwt = true

[functions.invoice-document]
verify_jwt = true

# O cron manda x-reconcile-secret, não um JWT. A função confere o segredo.
[functions.reconcile-payments]
verify_jwt = false

# O cron manda x-ledger-reconcile-secret, não um JWT. A função só faz GET.
[functions.ledger-reconcile]
verify_jwt = false

[functions.venue-payouts]
verify_jwt = true

[functions.venue-documents]
verify_jwt = true

# O cron manda x-venue-withdrawals-secret, não um JWT.
[functions.schedule-venue-withdrawals]
verify_jwt = false

# O admin chama com o JWT (aal2). A resposta não traz valor de segredo.
[functions.payments-readiness]
verify_jwt = true

# O PagBank manda x-authenticity-token, o mesmo segredo do webhook de cobrança.
[functions.pagbank-transfer-webhook]
verify_jwt = false

# O dono manda o JWT. A função só chama a PagBank com a flag ligada.
[functions.pagbank-signup]
verify_jwt = true

# O cron manda x-pagbank-signup-probe-secret, não um JWT.
[functions.pagbank-signup-probe]
verify_jwt = false

# E-mails do Auth, em pt-BR. O CLI local lê subject e content_path.
# O projeto remoto não muda sozinho. Cole cada assunto e o HTML em
# Authentication > Email Templates, ou rode tool/apply_auth_email_templates.sh
# com SUPABASE_ACCESS_TOKEN. O script não guarda o token.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no EscapeMatch"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha no EscapeMatch"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Seu link para entrar no EscapeMatch"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme a troca de e-mail no EscapeMatch"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Você foi convidado para o EscapeMatch"
content_path = "./supabase/templates/invite.html"

# Google. O segredo não fica neste arquivo. Exporte
# SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID e
# SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET e só então mude enabled para true.
# Se houver client id de Android ou iOS, o da web vem primeiro, separado
# por vírgula. skip_nonce_check fica falso: o fluxo é o redirect do Auth,
# não o id token no app.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
